services:
  backend:
    build: ./backend
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in a local .env file}
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - backend
